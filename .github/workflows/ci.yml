name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
      - run: npm install --global pnpm@10.33.0
      - run: pnpm install --frozen-lockfile
      - run: python3 -m pip install --disable-pip-version-check jsonschema==4.23.0
      - run: rustup show active-toolchain
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --features alight-ingest/beam --locked -- -D warnings
      - run: cargo test --workspace --features alight-ingest/beam --locked
      - run: python3 scripts/check_repository.py
      - run: python3 scripts/test_webhook_signature.py
      - run: python3 scripts/verify_phase0_receipt.py
      - run: python3 scripts/verify_phase1_receipt.py
      - run: python3 scripts/verify_phase2_receipt.py
      - run: cargo run -p alight-econ --example replay --locked -- 250 2026-10-03T22:14:40Z | python3 scripts/verify_phase3_receipt.py
      - run: node --check scripts/spike_grpc.mjs && node --check scripts/spike_ws.mjs && node --check scripts/create_canary_wallet.mjs
