[workspace]
resolver = "3"
members = ["crates/alight-types", "crates/alight-ingest", "bin/alight"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.96.1"

[workspace.dependencies]
alight-types = { path = "crates/alight-types" }
alight-ingest = { path = "crates/alight-ingest" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
thiserror = "=2.0.18"
dotenvy = "=0.15.7"
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls", "json"] }
tokio = { version = "=1.52.3", features = ["macros", "rt-multi-thread"] }
bs58 = "=0.5.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
